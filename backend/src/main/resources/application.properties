# Server Configuration
server.port=8080

# Database Configuration (Defaults to H2, overrides with DB_URL env variable if provided)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.homecanvas=DEBUG
logging.file.name=backend.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
jwt.secret=your_secret_key_here_at_least_256_bits_long_for_security_purposes
jwt.expiration=86400000

# CORS Configuration (for React frontend)
app.cors.allowedOrigins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:sk-test-key-for-development}
gemini.model.name=gemini-1.5-flash
gemini.rate.limit.requests=60
gemini.rate.limit.window=60000

# DEBUG MODE CONFIGURATION (For development without ESP32)
# Activate with: -Ddebug.mode=true or environment variable
debug.mode=${DEBUG_MODE:false}
debug.simulator.enabled=${DEBUG_MODE:false}
debug.simulator.interval=1000
debug.simulator.pir.probability=0.6
debug.simulator.sound.min=500
debug.simulator.sound.max=3500
debug.simulator.light.min=100
debug.simulator.light.max=4000

# MQTT Configuration (HiveMQ Cloud)
mqtt.broker.url=${MQTT_BROKER_URL:ssl://ce38598a22f646088affcf71d4335a09.s1.eu.hivemq.cloud:8883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.client.id=HomeCanvas-Backend
mqtt.topic.telemetry=homecanvas/telemetry/#
mqtt.topic.commands=homecanvas/commands/